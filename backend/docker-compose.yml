version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medlife_postgres
    environment:
      POSTGRES_DB: medlife_db
      POSTGRES_USER: medlife_user
      POSTGRES_PASSWORD: medlife_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: